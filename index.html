<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>토익영단어</title>
<style>
  /* 시스템 색(Canvas/CanvasText)에 맡기면 인앱 브라우저에서 배경만 밝게 칠해지고
     글자는 다크용 흰색으로 잡혀 흰 글자가 흰 배경에 묻힌다. 명시적으로 지정한다. */
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --line: #8884; --accent: #6c4cf1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eaeaea; } }
  /* display를 직접 준 요소(label:flex, #grid:grid)는 브라우저 기본 [hidden]을 이겨버린다 */
  [hidden] { display: none !important; }
  /* pan-x pan-y = 스크롤만 허용. 핀치 줌과 더블탭 줌을 둘 다 끈다 */
  html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, sans-serif; touch-action: pan-x pan-y; }
  /* z-index 없는 sticky는 WebKit에서 아래 콘텐츠가 뚫고 올라온다 (카카오 인앱 브라우저) */
  header { position: sticky; top: 0; z-index: 10; padding: 10px 14px;
           border-bottom: 1px solid var(--line); background: var(--bg);
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  /* 좁으면 줄바꿈으로 흘러가되, 항목 안에서 글자가 쪼개지지는 않게 */
  header > * { white-space: nowrap; }
  h1 { font-size: 17px; margin: 0; margin-right: auto; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line);
           border-radius: 8px; background: none; color: var(--fg); cursor: pointer; }
  button[disabled] { opacity: .35; cursor: default; }
  button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
          gap: 8px; padding: 16px; }
  ol { list-style: none; margin: 0; padding: 0 }
  li { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  li.on { background: #6c4cf126; }
  /* 별을 넣으면서 flex가 됐다. .txt 가 없으면 단어와 뜻이 좌우로 벌어진다 */
  li, .qwrong { display: flex; gap: 10px; align-items: flex-start; }
  .txt { flex: 1; min-width: 0; }
  /* padding 과 같은 크기의 음수 margin. 보이는 위치는 그대로 두고 손가락 히트 영역만 넓힌다 */
  .star { border: none; font-size: 20px; line-height: 1.3; color: var(--accent);
          padding: 8px; margin: -8px; }
  .w { font-size: 19px; font-weight: 600; }
  .m { opacity: .75; font-size: 14px; }
  .lz { font-size: 12px; opacity: .6; }
  label { display: flex; gap: 5px; align-items: center; font-size: 14px; }
  header button { padding: 6px 10px; }

  #quiz { padding: 20px 16px 48px; max-width: 560px; margin: 0 auto; }
  .qmeta { font-size: 13px; opacity: .6; }
  .qtype { font-size: 13px; color: var(--accent); margin-top: 16px; }
  .qprompt { font-size: 25px; font-weight: 700; margin: 4px 0 24px; line-height: 1.35; }
  #qopts { display: grid; gap: 10px; }
  #qopts button { text-align: left; padding: 13px 15px; }
  #qopts button.ok { background: #1f9d5533; border-color: #1f9d55; }
  #qopts button.no { background: #e0333333; border-color: #e03333; }
  .qscore { font-size: 30px; font-weight: 700; margin: 8px 0 20px; }
  .qwrong { padding: 10px 0; border-bottom: 1px solid var(--line); }

  #exam { padding: 20px 16px 48px; max-width: 560px; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 20px; }
  .ex { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .exq { font-size: 20px; font-weight: 700; margin: 4px 0 12px; line-height: 1.35; }
  .exin { width: 100%; box-sizing: border-box; font: inherit; padding: 12px 14px;
          border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--fg); }
  .exopts { display: grid; gap: 8px; }
  .exopts button { text-align: left; padding: 11px 14px; }
  .exopts button.pick { border-color: var(--accent); background: #6c4cf126; }
  .exopts button.ok { background: #1f9d5533; border-color: #1f9d55; }
  .exopts button.no { background: #e0333333; border-color: #e03333; }
  .exres { margin-top: 10px; font-size: 14px; display: flex; gap: 10px;
           align-items: center; flex-wrap: wrap; }
  .exok { color: #1f9d55; font-weight: 600; }
  .exno { color: #e03333; font-weight: 600; }
  #scorebar { padding-bottom: 14px; border-bottom: 1px solid var(--line); }

  /* 세로 가운데 정렬 대신 위 여백. flex 중앙 정렬은 모바일에서 키보드가 올라올 때 폼이 밀린다 */
  /* border-box 가 아니면 320 + 좌우 패딩 40 = 360px 이 되어 좁은 기기에서 가로로 넘친다 */
  #auth { padding: 12vh 20px 48px; max-width: 360px; box-sizing: border-box; margin: 0 auto; }
  .authlead { font-size: 14px; opacity: .65; line-height: 1.65; margin: 0 0 26px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; opacity: .55; margin-bottom: 6px; }
  /* font: inherit = 16px. 더 작으면 iOS가 포커스할 때 화면을 확대해버린다 */
  .field input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px 14px;
                 border: 1px solid var(--line); border-radius: 8px;
                 background: none; color: var(--fg); }
  .field input:focus { outline: none; border-color: var(--accent); }
  .primary { width: 100%; padding: 13px; margin-top: 6px; font-weight: 600;
             background: var(--accent); border-color: var(--accent); color: #fff; }
  .swap { display: block; margin: 18px auto 0; border: none;
          font-size: 14px; opacity: .7; text-decoration: underline; }
  /* min-height 가 없으면 에러가 뜰 때 버튼이 아래로 밀린다 */
  .autherr { color: #e03333; font-size: 14px; line-height: 1.5;
             min-height: 21px; margin: 12px 0 0; }
</style>

<header>
  <button id="back" hidden>←</button>
  <h1 id="title">강 선택</h1>
  <button id="go" disabled>▶ 선택 듣기</button>
  <button id="quizgo" disabled>퀴즈</button>
  <button id="examgo" disabled>시험</button>
  <button id="acct">로그인</button>
  <label id="optloop"><input type="checkbox" id="loop" checked>이어듣기</label>
  <label id="opttwice"><input type="checkbox" id="twice">2회</label>
  <label id="optword"><input type="checkbox" id="wordonly">단어만</label>
</header>
<div id="grid"></div>
<ol id="list"></ol>
<div id="quiz" hidden></div>
<div id="exam" hidden></div>
<div id="auth" hidden></div>
<audio id="au"></audio>

<!-- CDN 대신 저장소에 둔다. 인앱 브라우저에서 CDN이 막히면 앱 전체가 죽는다 -->
<script src="vendor/supabase.js"></script>
<script>
const $ = id => document.getElementById(id)
// 뜻에 '<시기 등이>' 같은 꺾쇠가 들어있다 (over, 68강). 태그로 먹히면 글자가 사라진다.
const esc = s => s.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))
let segs = [], cur = [], i = -1, plays = 0, file = null
const sel = new Set()

/* ---------- 계정 · 찜 ---------- */

// 둘 다 브라우저에 그대로 박히는 공개값이다. 막는 건 키가 아니라 RLS(auth.uid() = user_id).
const sb = window.supabase.createClient(
  'https://pzqupmiufoxsdhixgzbq.supabase.co',
  'sb_publishable_RpOQfoK4pLPUbJMhjFRbrA_rQ3WCUwW')

// 세션은 여전히 localStorage에 있다. 하지만 날아가도 다시 로그인하면 찜은 서버에 그대로다.
// 날아가면 안 되는 건 세션이 아니라 데이터고, 그게 이번에 서버로 옮긴 이유다.
let me = null
const star = new Set()   // 손으로 찜한 seq
const weak = new Set()   // 자주 틀린 seq (attempts 에서 계산)
const WEAK_MIN = 2       // 오답 이 횟수 이상이면 '자주 틀림'

sb.auth.onAuthStateChange(async (_e, s) => {   // 첫 로드 때도 INITIAL_SESSION 으로 한 번 온다
  me = s?.user ?? null
  $('acct').textContent = me ? '계정' : '로그인'
  star.clear()
  if (me) {
    const { data } = await sb.from('stars').select('seq')
    for (const r of data ?? []) star.add(r.seq)
  }
  starChip.paint()
  await loadWeak()
  // 계정 화면을 띄워둔 채 세션이 끊기면(로그아웃·만료) '계정 · 로그아웃'이 그대로 남는다.
  // 로그인 성공 쪽은 제출 핸들러가 화면을 옮기므로 여기서 건드리지 않는다.
  if (!me && !$('auth').hidden) showAuth()
})

// 찜과 자주틀림은 '강'이 아니지만 강처럼 고르게 한다. 그래야 picked() 하나만 고치면
// 듣기·퀴즈·시험이 전부 따라온다.
// 비어 있으면 아예 숨긴다. '★ 찜 0' 이 회색으로 떠 있으면 뭘 하라는 건지 모른다.
function virtualChip(key, label, set) {
  const b = document.createElement('button')
  b.onclick = () => {
    sel.has(key) ? sel.delete(key) : sel.add(key)
    b.classList.toggle('sel', sel.has(key))
    syncGo()
  }
  b.paint = () => {
    b.textContent = `${key} ${label} ${set.size}`
    b.hidden = !set.size
    if (!set.size) { sel.delete(key); b.classList.remove('sel') }
    syncGo()
  }
  b.paint()
  return b
}
const starChip = virtualChip('★', '찜', star)
const weakChip = virtualChip('✕', '자주 틀림', weak)
function syncGo() {
  $('go').disabled = $('quizgo').disabled = $('examgo').disabled = !sel.size
  $('go').textContent = sel.size ? `▶ 선택 듣기 (+${sel.size})` : '▶ 선택 듣기'
}

// 목록·퀴즈 결과·시험 결과 세 군데가 같은 버튼을 쓴다.
function starBtn(seq) {
  const b = document.createElement('button')
  b.className = 'star'
  const paint = () => b.textContent = star.has(seq) ? '★' : '☆'
  paint()
  b.onclick = async e => {
    e.stopPropagation()          // li 클릭은 재생이다. 안 막으면 별 누를 때마다 재생된다
    if (!me) return showAuth()
    const on = star.has(seq)
    on ? star.delete(seq) : star.add(seq)
    paint()                      // 낙관적으로 먼저 칠하고
    // .select() 를 붙여야 실제로 몇 행이 바뀌었는지 돌아온다. 안 붙이면 RLS 에 막힌 delete 가
    // 에러 없이 '0행 삭제' 로 끝나서, 지워지지도 않았는데 화면만 ☆ 로 바뀐다.
    const { data, error } = on ? await sb.from('stars').delete().eq('seq', seq).select()
                               : await sb.from('stars').insert({ seq }).select()
    if (error || !data?.length) { on ? star.add(seq) : star.delete(seq); paint() }
    starChip.paint()
  }
  return b
}

/* ---------- 시도 이력 ---------- */

// 시도를 통째로 받아서 JS 에서 센다. 한 사람이 쌓는 양이 몇천 행이라 이걸로 충분하다.
// ponytail: 그 이상 쌓이면 서버에 집계 뷰를 두는 게 맞다.
async function loadWeak() {
  weak.clear()
  if (me) {
    const { data } = await sb.from('attempts').select('seq, ok')
    const miss = new Map()
    for (const r of data ?? []) if (!r.ok) miss.set(r.seq, (miss.get(r.seq) ?? 0) + 1)
    for (const [seq, n] of miss) if (n >= WEAK_MIN) weak.add(seq)
  }
  weakChip.paint()
}

// 기록은 화면을 막지 않는다. 서버가 죽어도 퀴즈는 계속 풀려야 한다.
// PostgrestBuilder 는 then 을 붙여야 실제로 나간다.
function logAttempt(seq, ok, mode) {
  if (me) sb.from('attempts').insert({ seq, ok, mode }).then(null, () => {})
}

$('acct').onclick = () => showAuth()

// Supabase 에러는 영어로 온다. 실제로 자주 보게 되는 것만 옮긴다.
function authMsg(m) {
  if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 틀렸다.'
  if (/already registered/i.test(m))        return '이미 가입된 이메일이다. 로그인으로 바꿔서 시도해라.'
  if (/at least (\d+) characters/i.test(m)) return `비밀번호는 ${m.match(/at least (\d+)/i)[1]}자 이상이어야 한다.`
  if (/valid email|invalid format/i.test(m)) return '이메일 형식이 아니다.'
  return m
}

let joining = false   // false = 로그인, true = 가입

function showAuth() {
  show('auth', me ? '계정' : joining ? '가입' : '로그인')
  if (me) return showAccount()

  const f = document.createElement('form')
  f.innerHTML =
    `<p class="authlead">찜한 단어는 계정에 저장된다.<br>
       로그인하면 폰에서 찜한 걸 PC에서도 그대로 볼 수 있고, 브라우저 기록을 지워도 남는다.</p>
     <div class="field">
       <label for="email">이메일</label>
       <input id="email" type="email" required autocapitalize="off" autocomplete="username">
     </div>
     <div class="field">
       <label for="pw">비밀번호</label>
       <input id="pw" type="password" required minlength="6"
              autocomplete="${joining ? 'new' : 'current'}-password">
     </div>
     <p class="autherr"></p>`

  // <form> 으로 감싸야 엔터 제출·비번 관리자 자동완성·접근성이 공짜로 따라온다
  const go = document.createElement('button')
  go.className = 'primary'
  go.textContent = joining ? '가입하기' : '로그인'
  f.append(go)

  f.onsubmit = async e => {
    e.preventDefault()
    const err = f.querySelector('.autherr')
    err.textContent = ''
    go.disabled = true
    go.textContent = '…'
    const c = { email: $('email').value.trim(), password: $('pw').value }
    const { data, error } = joining ? await sb.auth.signUp(c)
                                    : await sb.auth.signInWithPassword(c)
    if (!error && data.session) return $('back').onclick()
    // 가입은 성공해도 세션이 없을 수 있다 — 대시보드에서 Confirm email 을 안 끈 경우
    err.textContent = error ? authMsg(error.message)
                            : '가입됐다. 메일의 확인 링크를 눌러야 로그인된다.'
    go.disabled = false
    go.textContent = joining ? '가입하기' : '로그인'
  }

  const swap = document.createElement('button')
  swap.type = 'button'          // form 안의 button 은 기본이 submit 이다
  swap.className = 'swap'
  swap.textContent = joining ? '이미 계정이 있으면 로그인' : '계정이 없으면 가입하기'
  swap.onclick = () => { joining = !joining; showAuth() }

  $('auth').replaceChildren(f, swap)
}

function showAccount() {
  const who = document.createElement('p')
  who.className = 'authlead'
  who.textContent = `${me.email} · 찜 ${star.size}개`
  const out = document.createElement('button')
  out.className = 'primary'
  out.textContent = '로그아웃'
  out.onclick = async () => { await sb.auth.signOut(); $('back').onclick() }
  $('auth').replaceChildren(who, out)
}
// 철자 → 그 철자가 갖는 모든 뜻 / 뜻 → 그 뜻을 갖는 모든 철자.
// raise 처럼 한 철자가 여러 뜻으로 쪼개져 있으면 보기끼리 다 정답이 되어버리므로
// 문제를 만들 때 이 집합을 통째로 보기에서 뺀다.
const meaningsOf = new Map(), wordsOf = new Map()

fetch('segments.json').then(r => r.json()).then(d => {
  segs = d
  for (const s of segs) {
    if (!meaningsOf.has(s.word)) meaningsOf.set(s.word, new Set())
    if (!wordsOf.has(s.meaning)) wordsOf.set(s.meaning, new Set())
    meaningsOf.get(s.word).add(s.meaning)
    wordsOf.get(s.meaning).add(s.word)
  }
  $('grid').append(starChip, weakChip, ...[...new Set(segs.map(s => s.lesson))].map(L => {
    const b = document.createElement('button')
    b.textContent = L
    b.onclick = () => {
      sel.has(L) ? sel.delete(L) : sel.add(L)
      b.classList.toggle('sel', sel.has(L))
      syncGo()
    }
    return b
  }))
  starChip.paint()
  weakChip.paint()
})

function show(name, title) {
  $('au').pause()
  $('title').textContent = title
  $('grid').hidden = name !== 'grid'
  $('list').hidden = name !== 'list'
  $('quiz').hidden = name !== 'quiz'
  $('exam').hidden = name !== 'exam'
  $('auth').hidden = name !== 'auth'
  $('back').hidden = name === 'grid'
  $('go').hidden = $('quizgo').hidden = $('examgo').hidden = $('acct').hidden = name !== 'grid'
  $('optloop').hidden = $('opttwice').hidden = $('optword').hidden = name !== 'list'
}

$('back').onclick = () => {
  i = -1
  $('list').replaceChildren()
  $('quiz').replaceChildren()
  $('exam').replaceChildren()
  $('auth').replaceChildren()
  loadWeak()          // 방금 푼 퀴즈·시험이 '자주 틀림' 개수에 바로 반영되도록
  show('grid', '강 선택')
}

/* ---------- 듣기 ---------- */

// segments.json이 이미 진도 순서라 filter만으로 순서가 유지된다.
// 찜도 '강' 하나로 취급하면 듣기·퀴즈·시험이 전부 이 함수 하나만 보면 된다.
function picked() {
  return segs.filter(s => sel.has(s.lesson)
                       || (sel.has('★') && star.has(s.seq))
                       || (sel.has('✕') && weak.has(s.seq)))
}

$('go').onclick = () => {
  cur = picked()
  show('list', `${cur.length}단어`)
  $('list').replaceChildren(...cur.map((s, n) => {
    const li = document.createElement('li')
    const txt = document.createElement('div'); txt.className = 'txt'
    txt.innerHTML = `<div class="w">${esc(s.word)} <span class="lz">${s.lesson}</span></div>
                     <div class="m">${esc(s.meaning)}</div>`
    li.append(starBtn(s.seq), txt)
    li.onclick = () => play(n)
    return li
  }))
  play(0)
}

// src 지정 직후엔 아직 메타데이터가 없어 seek이 무시된다 → 로드된 뒤에 건다
function seek(t) {
  if ($('au').readyState >= 1) $('au').currentTime = t
  else $('au').addEventListener('loadedmetadata', () => $('au').currentTime = t, { once: true })
}

function play(n) {
  const s = cur[n]
  if (!s) return
  i = n; plays = 0
  ;[...$('list').children].forEach((li, k) => li.classList.toggle('on', k === n))
  $('list').children[n].scrollIntoView({ block: 'center', behavior: 'smooth' })
  if (file !== s.file) { file = s.file; $('au').src = 'mp3/' + s.file }
  seek(s.start)
  $('au').play()
}

// timeupdate는 ~250ms 간격이라 끝을 넘겨 다음 단어가 새어 나온다.
// 화면이 켜져 있을 땐 rAF(~16ms)로 정확히 끊고, 백그라운드에선 rAF가 멈추므로
// timeupdate를 예비로 남긴다.
let raf = 0
function check() {
  const s = cur[i]
  // currentTime < start 는 seek이 아직 안 끝난 상태 (앞 단어로 되돌아갈 때)
  if (!s || $('quiz').hidden === false) return false
  const stop = $('wordonly').checked ? s.wordEnd : s.end   // 뜻 빼고 영단어만
  if ($('au').currentTime < s.start || $('au').currentTime < stop) return false
  $('au').pause()
  cancelAnimationFrame(raf)
  if ($('twice').checked && ++plays < 2) { seek(s.start); $('au').play() }
  else if ($('loop').checked && i + 1 < cur.length) play(i + 1)
  return true
}
function tick() { if (!$('au').paused && !check()) raf = requestAnimationFrame(tick) }
$('au').onplay = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(tick) }
$('au').ontimeupdate = check

onkeydown = e => {
  if ($('list').hidden) return
  if (e.key === ' ') { e.preventDefault(); $('au').paused ? $('au').play() : $('au').pause() }
  if (e.key === 'ArrowDown') play(i + 1)
  if (e.key === 'ArrowUp') play(i - 1)
}

/* ---------- 퀴즈 ---------- */

let qs = [], qi = 0, hit = 0, miss = []

function shuffle(a) {
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1))
    ;[a[k], a[j]] = [a[j], a[k]]
  }
  return a
}

// 정답과 헷갈릴 수 있는 값(ban)을 뺀 뒤 서로 다른 보기 3개를 뽑는다.
// 선택한 강 안에서 먼저 찾고, 모자라면 전체에서 채운다.
function distractors(pool, valueOf, ban) {
  const out = []
  for (const src of [pool, segs]) {
    for (const c of shuffle(src.slice())) {
      const v = valueOf(c)
      if (ban.has(v)) continue
      ban.add(v); out.push(v)
      if (out.length === 3) return out
    }
  }
  return out
}

function makeQ(e, pool) {
  if (Math.random() < 0.5) {
    // 단어 → 뜻. 같은 철자가 갖는 뜻은 전부 정답이 될 수 있으므로 통째로 배제
    const ban = new Set(meaningsOf.get(e.word))
    return { type: '뜻 고르기', prompt: e.word, answer: e.meaning,
             opts: shuffle([e.meaning, ...distractors(pool, c => c.meaning, ban)]) }
  }
  // 뜻 → 단어. 같은 뜻을 갖는 철자는 전부 정답이 될 수 있으므로 통째로 배제
  const ban = new Set(wordsOf.get(e.meaning))
  return { type: '단어 고르기', prompt: e.meaning, answer: e.word,
           opts: shuffle([e.word, ...distractors(pool, c => c.word, ban)]) }
}

$('quizgo').onclick = () => {
  const pool = picked()
  qs = shuffle(pool.slice()).map(e => ({ ...makeQ(e, pool), src: e }))
  qi = 0; hit = 0; miss = []
  show('quiz', `퀴즈 · ${qs.length}문제`)
  askQ()
}

function askQ() {
  const q = qs[qi]
  if (!q) return showResult()
  $('quiz').innerHTML =
    `<div class="qmeta">${qi + 1} / ${qs.length} · 맞음 ${hit} · 틀림 ${miss.length}</div>
     <div class="qtype">${q.type}</div>
     <div class="qprompt"></div>
     <div id="qopts"></div>`
  $('quiz').querySelector('.qprompt').textContent = q.prompt
  $('qopts').append(...q.opts.map(o => {
    const b = document.createElement('button')
    b.textContent = o
    b.onclick = () => answer(b, o)
    return b
  }))
}

function answer(btn, chosen) {
  const q = qs[qi]
  const right = chosen === q.answer
  for (const b of $('qopts').children) {
    b.onclick = null
    if (b.textContent === q.answer) b.classList.add('ok')
  }
  if (right) hit++
  else { btn.classList.add('no'); miss.push(q) }
  logAttempt(q.src.seq, right, '퀴즈')
  qi++
  setTimeout(askQ, right ? 700 : 1800)
}

function showResult() {
  show('quiz', '퀴즈 결과')
  const pct = Math.round(hit / qs.length * 100)
  $('quiz').innerHTML =
    `<div class="qmeta">${qs.length}문제</div>
     <div class="qscore">${hit} / ${qs.length} · ${pct}%</div>
     ${miss.length ? '<div class="qmeta">틀린 것</div>' : ''}
     ${miss.map(q => `<div class="qwrong" data-seq="${q.src.seq}"><div class="txt">
        <div class="w">${esc(q.src.word)} <span class="lz">${q.src.lesson}</span></div>
        <div class="m">${esc(q.src.meaning)}</div></div></div>`).join('')}
     <p><button id="again">다시 풀기</button></p>`
  // 방금 틀린 게 곧 '안 외워지는 단어'다. 목록으로 되돌아가 찾게 하지 않는다.
  for (const d of $('quiz').querySelectorAll('.qwrong')) d.prepend(starBtn(+d.dataset.seq))
  $('again').onclick = () => $('quizgo').onclick()
}

/* ---------- 시험 ---------- */

let exam = [], cfg = { count: 20, kind: '섞어서' }

// 뜻 문자열을 채점 후보로 쪼갠다.
//   "n. 1. 몫, 지분, 주식 2. 공유하다, 나누다" → 몫 / 지분 / 주식 / 공유하다 / 나누다
//   "주의[경고]를 주다"                        → 주의를주다 / 경고를주다  (대괄호는 대체 표현)
function bare(s) {
  return s.replace(/\([^)]*\)/g, '').replace(/[\s~·․\-–—.,;/]/g, '')
}
function senses(meaning) {
  // 뜻 번호는 지우는 게 아니라 구분자로 바꾼다.
  // 지우기만 하면 "주식 2. 공유하다" 가 "주식공유하다" 한 덩어리가 된다.
  const body = meaning.replace(/^[a-z]+\.\s*/i, '').replace(/\(?\d+\)?\.\s*/g, ',')
  const forms = body.includes('[')
    ? [body.replace(/\[[^\]]*\]/g, ''), body.replace(/[^\s,;/]*\[([^\]]*)\]/g, '$1')]
    : [body]
  const out = new Set()
  for (const f of forms)
    for (const part of f.split(/[,;/]/)) {
      const v = bare(part)
      if (v) out.add(v)
    }
  return [...out]
}
// 뜻이 여러 개면 하나만 맞아도 정답. 유의어(걷다↔걸어가다)는 자동으로 못 잡는다.
// 여기서 안 걸린 답은 정답을 보여주고 사용자가 직접 O/X 를 준다.
//
// 부분일치는 '포함'이 아니라 '앞에서부터'만 인정한다. 포함으로 하면 "하다" 한 방에
// 공유하다·제공하다가 전부 정답이 되어버린다. 오답을 정답으로 넘기는 실수가
// 정답을 오답으로 떨구는 실수보다 나쁘다 (후자는 한 번 눌러 뒤집으면 된다).
function autoGrade(given, meaning) {
  const S = senses(meaning), G = senses(given)
  return G.some(g => S.some(s => s === g
    || (g.length >= 2 && s.startsWith(g)) || (s.length >= 2 && g.startsWith(s))))
}

function chipRow(label, items, get, set) {
  const title = document.createElement('div')
  title.className = 'qtype'; title.textContent = label
  const row = document.createElement('div'); row.className = 'chips'
  const paint = () => [...row.children].forEach((b, k) => b.classList.toggle('sel', items[k][1] === get()))
  row.append(...items.map(([text, val]) => {
    const b = document.createElement('button')
    b.textContent = text
    b.onclick = () => { set(val); paint() }
    return b
  }))
  paint()
  const box = document.createElement('div')
  box.append(title, row)
  return box
}

$('examgo').onclick = () => {
  const pool = picked()
  show('exam', '시험 설정')
  const counts = [...new Set([10, 20, 30, 50, pool.length].filter(n => n <= pool.length))]
  cfg.count = Math.min(cfg.count, pool.length)
  const start = document.createElement('button')
  start.textContent = '시험 시작'
  start.onclick = () => startExam(pool)
  const p = document.createElement('p'); p.append(start)
  $('exam').replaceChildren(
    chipRow('문제 수', counts.map(n => [n === pool.length ? `전체 ${n}` : String(n), n]),
            () => cfg.count, v => cfg.count = v),
    chipRow('형식', [['객관식', '객관식'], ['주관식', '주관식'], ['섞어서', '섞어서']],
            () => cfg.kind, v => cfg.kind = v),
    p)
}

function startExam(pool) {
  exam = shuffle(pool.slice()).slice(0, cfg.count).map(e => {
    const kind = cfg.kind === '섞어서' ? (Math.random() < 0.5 ? '객관식' : '주관식') : cfg.kind
    return kind === '주관식'
      ? { kind, type: '뜻 쓰기', prompt: e.word, answer: e.meaning, src: e, given: '' }
      : { kind, ...makeQ(e, pool), src: e, given: null }
  })
  renderExam()
}

function renderExam() {
  show('exam', `시험 · ${exam.length}문제`)
  const frag = document.createDocumentFragment()
  exam.forEach((q, n) => {
    const box = document.createElement('div'); box.className = 'ex'
    const meta = document.createElement('div'); meta.className = 'qmeta'
    meta.textContent = `${n + 1}. ${q.type}`
    const prompt = document.createElement('div'); prompt.className = 'exq'
    prompt.textContent = q.prompt
    box.append(meta, prompt)

    if (q.kind === '주관식') {
      const inp = document.createElement('input')
      inp.className = 'exin'; inp.placeholder = '뜻을 쓰세요'
      inp.autocapitalize = 'off'; inp.value = q.given
      inp.oninput = () => q.given = inp.value
      q.inputs = [inp]
      box.append(inp)
    } else {
      const opts = document.createElement('div'); opts.className = 'exopts'
      opts.append(...q.opts.map(o => {
        const b = document.createElement('button')
        b.textContent = o
        b.onclick = () => {
          q.given = o
          ;[...opts.children].forEach(x => x.classList.toggle('pick', x === b))
        }
        return b
      }))
      q.inputs = [...opts.children]
      box.append(opts)
    }
    q.res = document.createElement('div'); q.res.className = 'exres'
    box.append(q.res)
    frag.append(box)
  })
  const submit = document.createElement('button')
  submit.textContent = '채점하기'
  submit.onclick = grade
  const p = document.createElement('p'); p.append(submit)
  frag.append(p)
  $('exam').replaceChildren(frag)
  scrollTo(0, 0)
}

function grade() {
  for (const q of exam) {
    q.ok = q.kind === '주관식' ? autoGrade(q.given, q.answer) : q.given === q.answer
    q.inputs.forEach(el => {
      el.disabled = true
      if (q.kind === '주관식') return
      if (el.textContent === q.answer) el.classList.add('ok')
      else if (el.textContent === q.given) el.classList.add('no')
    })
    paintRow(q)
  }
  logExam()
  paintScore()
  scrollTo(0, 0)
}

// 한 번에 넣고 id 를 돌려받는다. 한 세트 안에서 seq 는 겹치지 않으므로
// 반환 순서에 기대지 않고 seq 로 짝지을 수 있다.
async function logExam() {
  if (!me) return
  const { data } = await sb.from('attempts')
    .insert(exam.map(q => ({ seq: q.src.seq, ok: q.ok, mode: '시험' })))
    .select('id, seq')
  const bySeq = new Map((data ?? []).map(r => [r.seq, r.id]))
  for (const q of exam) q.attemptId = bySeq.get(q.src.seq)
}

function paintRow(q) {
  const mark = document.createElement('span')
  mark.className = q.ok ? 'exok' : 'exno'
  mark.textContent = q.ok ? '○ 정답' : '✕ 오답'
  const ans = document.createElement('span'); ans.className = 'm'
  ans.textContent = '정답: ' + q.answer
  q.res.replaceChildren(mark, ans)
  if (q.kind === '주관식') {
    // 유의어는 자동 채점이 못 잡는다 → 본인이 뒤집는다
    const flip = document.createElement('button')
    flip.textContent = q.ok ? '오답으로' : '정답으로'
    flip.onclick = () => {
      q.ok = !q.ok
      // 자동 채점을 사람이 뒤집었으면 그게 진짜 결과다. 이력도 따라 고친다
      if (q.attemptId) sb.from('attempts').update({ ok: q.ok }).eq('id', q.attemptId).then(null, () => {})
      paintRow(q); paintScore()
    }
    q.res.append(flip)
  }
  q.res.append(starBtn(q.src.seq))
}

function paintScore() {
  const ok = exam.filter(q => q.ok).length
  const pct = Math.round(ok / exam.length * 100)
  let bar = $('scorebar')
  if (!bar) { bar = document.createElement('div'); bar.id = 'scorebar'; $('exam').prepend(bar) }
  const s = document.createElement('div'); s.className = 'qscore'; s.textContent = `${pct}점`
  const d = document.createElement('div'); d.className = 'qmeta'
  d.textContent = `${exam.length}문제 중 ${ok}개 정답`
  bar.replaceChildren(s, d)
  show('exam', `시험 결과 · ${pct}점`)
}

// iOS Safari는 접근성 때문에 user-scalable=no 를 무시한다. 핀치 제스처를 직접 막는다.
for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
  document.addEventListener(t, e => e.preventDefault(), { passive: false })

show('grid', '강 선택')   // 초기 화면도 같은 규칙으로 (안 하면 듣기 옵션이 강 선택에 남는다)
</script>
